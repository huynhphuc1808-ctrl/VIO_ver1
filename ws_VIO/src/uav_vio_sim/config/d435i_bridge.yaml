- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Visualization streams subscribe to Gazebo only while ROS consumers exist.
# Stereo and IMU below remain continuously available to VIO_ver1.
- ros_topic_name: /vio/sensors/d435/image_raw
  gz_topic_name: /vio/sensors/d435/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

