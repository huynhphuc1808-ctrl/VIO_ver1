# VIO_ver1 requires reliable images. Publish directly from the same Gazebo
# sensors, preserving timestamps and optical frames without a Python relay.
- ros_topic_name: /vio/vio_estimator/left/image_raw
  gz_topic_name: /vio/sensors/d435/left/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  # No preset: ros_gz_bridge's default publisher QoS is reliable/volatile.
  publisher_queue: 10

- ros_topic_name: /vio/vio_estimator/right/image_raw
  gz_topic_name: /vio/sensors/d435/right/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  # No preset: ros_gz_bridge's default publisher QoS is reliable/volatile.
  publisher_queue: 10
